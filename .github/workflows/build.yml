name: Build WAKELESS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android-capacitor/package.json
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Install Capacitor
        working-directory: android-capacitor
        run: npm install
      - name: Add Android platform
        working-directory: android-capacitor
        run: npx cap add android
      - name: Sync web app
        working-directory: android-capacitor
        run: npx cap sync android
      - name: Build APK
        working-directory: android-capacitor/android
        run: ./gradlew assembleDebug
      - name: Prepare APK
        run: cp android-capacitor/android/app/build/outputs/apk/debug/app-debug.apk WAKELESS-Android.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WAKELESS-Android-APK
          path: WAKELESS-Android.apk

  windows:
    name: Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows-electron/package.json
      - name: Copy game into Electron package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-electron/web | Out-Null
          Copy-Item web/index.html windows-electron/web/index.html -Force
      - name: Install Electron dependencies
        working-directory: windows-electron
        run: npm install
      - name: Build Windows installer
        working-directory: windows-electron
        run: npx electron-builder --win nsis --x64 --config.directories.output=dist-installer --config.productName=WAKELESS --config.win.artifactName=WAKELESS-Windows-Setup.exe
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WAKELESS-Windows-EXE
          path: windows-electron/dist-installer/WAKELESS-Windows-Setup.exe

  release:
    name: Publish stable downloads
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: WAKELESS-Android-APK
          path: release
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: WAKELESS-Windows-EXE
          path: release
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists"
          else
            gh release create v1.0.0 --repo "${{ github.repository }}" --title "WAKLESS v1.0.0" --notes "WAKLESS stable downloads for Android and Windows."
          fi
          gh release upload v1.0.0 release/WAKELESS-Android.apk --repo "${{ github.repository }}" --clobber
          gh release upload v1.0.0 release/WAKELESS-Windows-Setup.exe --repo "${{ github.repository }}" --clobber
